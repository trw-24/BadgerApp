version: '3.8'

services:
  # Main application service
  badger-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://badger_admin:BadgerPass123!@postgres:5432/badgers
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=badger-secret-key-2023-dev
      - BADGER_API=https://api.wildlifetrackers.com/badgers
      - FLASK_ENV=development
      - DEBUG=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ../logs:/app/logs
      - /tmp:/tmp  # For session and tracking files
    networks:
      - badger-network
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=badgers
      - POSTGRES_USER=badger_admin
      - POSTGRES_PASSWORD=BadgerPass123!
    ports:
      - "5432:5432"  # Exposed for development access
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - badger-network
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Exposed for development access
    volumes:
      - redis_data:/data
    networks:
      - badger-network
    restart: unless-stopped
    # No authentication for development simplicity

  # Development database admin tool
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@badgerdelivery.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - badger-network
    restart: unless-stopped

  # Redis admin tool
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - badger-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  badger-network:
    driver: bridge
